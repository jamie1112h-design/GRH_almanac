<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand River Hills Inc. Almanac – Initiative Record</title>
<style>
  :root {
    --bg: #14181F;
    --surface: #1C2230;
    --surface-alt: #191E29;
    --record-bg: #181D28;
    --border: #2A3142;
    --text-primary: #F4F1E8;
    --text-body: #E8E4D8;
    --text-muted: #8B93A6;
    --text-dim: #6B7280;
    --gold: #C9A227;
    --status-strong: #6B9B6E;
    --status-developing: #C9A227;
    --status-early: #8A93A6;
    --status-idea: #5B6272;
    --font-display: Georgia, "Times New Roman", serif;
    --font-body: Arial, Helvetica, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-body);
    font-family: var(--font-body);
    padding: 32px 20px 300px;
  }

  .wrap { max-width: 1000px; margin: 0 auto; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-muted);
    font-size: 16px;
    text-decoration: none;
    margin-bottom: 18px;
  }
  .back-link:hover { color: var(--gold); }
  .back-link-bottom { margin-top: 32px; margin-bottom: 0; }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .entity-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 4px;
    color: var(--bg);
    margin-right: 10px;
    vertical-align: middle;
  }
  .entity-grhi { background: #8FA6C9; }
  .entity-grht { background: #C9A227; }
  .entity-grhp { background: #A98BC4; }
  .entity-grhcy { background: #5FB3B3; }
  .entity-grhci { background: #C97D60; }
  .entity-grhns { background: #7FB069; }
  .entity-grhbc { background: #4A7A8C; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--bg);
    white-space: nowrap;
    margin-left: 10px;
    vertical-align: middle;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 34px;
    font-weight: 400;
    margin: 0;
    color: var(--text-primary);
    border-bottom: 2px solid var(--gold);
    padding-bottom: 14px;
  }

  .badges { margin-top: 10px; }

  .entity-source {
    font-size: 13.5px;
    color: #D6D8DA;
    line-height: 1.55;
    margin: 14px 0 0;
    max-width: 780px;
  }

  .summary-text {
    font-size: 14.5px;
    color: #C7CCD6;
    line-height: 1.6;
    margin: 10px 0 0;
    max-width: 780px;
  }

  .panel {
    margin-top: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 22px 24px;
  }

  .panel-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 6px;
  }

  .panel-note {
    font-size: 15px;
    color: var(--text-primary);
    margin: 0 0 16px;
    max-width: 680px;
    line-height: 1.55;
  }

  .field-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 5px;
  }

  .field-text {
    font-size: 13.5px;
    color: #D6D8DA;
    line-height: 1.6;
    max-width: 820px;
  }

  .field-note {
    font-size: 13.5px;
    color: #C7CCD6;
    font-style: italic;
    line-height: 1.55;
    max-width: 820px;
    margin: 0 0 6px;
  }

  .field-block + .field-block { margin-top: 16px; }

  .empty-state {
    font-size: 13.5px;
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.6;
  }

  .comp-line {
    font-size: 13.5px;
    color: #D6D8DA;
    line-height: 1.6;
    max-width: 820px;
  }

  table.val-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 4px;
    font-size: 13px;
  }

  table.val-table th {
    text-align: left;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-primary);
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.val-table th.num { text-align: right; }

  table.val-table td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    color: #C7CCD6;
    vertical-align: top;
  }
  table.val-table tr:last-child td { border-bottom: none; }

  table.val-table td.num {
    text-align: right;
    font-family: var(--font-display);
    color: var(--text-primary);
    max-width: 220px;
    white-space: normal;
    line-height: 1.5;
  }

  .val-note-text { max-width: 320px; }

  .val-family-block + .val-family-block { margin-top: 28px; }
  .val-family-header {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 400;
    color: var(--text-primary);
    border-top: 2px solid var(--gold);
    padding-top: 14px;
    margin-bottom: 10px;
  }

  /* Admin Mode (Decision 10 pattern, reused from grhAlmanac_index.html) */

  .password-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .password-modal {
    background: var(--surface);
    border: 1px solid #C97D60;
    border-radius: 8px;
    padding: 24px 26px;
    width: 320px;
    max-width: 90vw;
  }
  .pw-modal-error {
    font-size: 12px;
    color: #C97D60;
    margin: -6px 0 10px;
  }

  .admin-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .admin-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1px solid #8A93A6;
    color: #8A93A6;
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  .admin-toggle-btn:hover { border-color: #C97D60; color: #C97D60; }
  .admin-toggle-btn.on {
    background: #C97D60;
    border-color: #C97D60;
    color: var(--bg);
  }

  .admin-status {
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #C97D60;
    text-transform: uppercase;
    font-weight: 700;
  }

  .attr-field {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .attr-update-trigger {
    display: none;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #C97D60;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
  }
  body.admin-mode .attr-update-trigger { display: inline; }
  .attr-update-trigger:hover { text-decoration: underline; }

  .editable-field {
    cursor: pointer;
    border-radius: 4px;
    padding: 4px 6px;
    margin: -4px -6px;
    transition: background 0.12s;
  }
  body.admin-mode .editable-field:hover {
    background: rgba(201, 162, 39, 0.12);
    outline: 1px dashed var(--gold);
  }
  body.admin-mode .editable-field::after {
    content: " ✎";
    color: var(--gold);
    font-size: 11px;
    opacity: 0.7;
  }

  .edit-textarea, .edit-input {
    width: 100%;
    max-width: 480px;
    font-family: var(--font-body);
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--text-primary);
    background: var(--surface-alt);
    border: 1px solid var(--gold);
    border-radius: 5px;
    padding: 8px 10px;
    resize: vertical;
  }

  .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .edit-save-btn, .edit-cancel-btn {
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 6px 14px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid var(--gold);
  }
  .edit-save-btn { background: var(--gold); color: var(--bg); }
  .edit-cancel-btn { background: none; color: var(--text-muted); border-color: var(--border); }

  .admin-update-form {
    margin-top: 10px;
    padding: 12px 14px;
    background: rgba(201, 125, 96, 0.08);
    border: 1px solid #C97D60;
    border-radius: 6px;
    max-width: 620px;
  }
  .admin-update-form .field-label { color: #C97D60; margin-bottom: 6px; }
  .admin-update-form .edit-input, .admin-update-form .edit-textarea { margin-bottom: 8px; }
  .admin-update-note {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .add-method-trigger {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #C97D60;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 14px;
  }
  .add-method-trigger:hover { text-decoration: underline; }

  .val-form-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .val-form-row .edit-input { max-width: 140px; }
  .val-form-row .edit-input.wide { max-width: 280px; }

  .not-found {
    margin-top: 60px;
    text-align: center;
  }
  .not-found-text {
    color: var(--text-muted);
    font-size: 15px;
    margin: 0 0 20px;
  }

  .full-record-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
  }
  .full-record-btn:hover {
    background: var(--gold);
    color: var(--bg);
  }
  .full-record-btn .arrow-right { font-size: 14px; }

  @media (max-width: 700px) {
    table.val-table { display: block; overflow-x: auto; white-space: nowrap; }
  }
</style>
</head>
<body>
<div class="password-modal-backdrop" id="pwModalBackdrop" style="display:none;">
  <div class="password-modal">
    <div class="field-label" style="color:#C97D60;">Admin Access</div>
    <p class="admin-update-note" style="margin-bottom:14px;">Enter the admin password to enable editing.</p>
    <input type="password" class="edit-input" id="pwModalInput" placeholder="Password" autocomplete="off">
    <div class="pw-modal-error" id="pwModalError" style="display:none;">Incorrect password.</div>
    <div class="edit-actions">
      <button class="edit-save-btn" id="pwModalSubmit">Unlock</button>
      <button class="edit-cancel-btn" id="pwModalCancel">Cancel</button>
    </div>
  </div>
</div>
<div class="wrap" id="wrap">
  <a class="back-link" href="index.html">← Back to Almanac</a>
  <div class="admin-bar">
    <button class="admin-toggle-btn" id="adminToggleBtn">Admin Mode: Off</button>
    <span class="admin-status" id="adminStatusLabel" style="display:none;">Editing enabled – mockup only, not yet wired to Supabase</span>
  </div>
  <div class="eyebrow" id="updatedOn">Updated on</div>
  <div id="content"></div>
  <a class="back-link back-link-bottom" href="index.html">← Back to Almanac</a>
</div>

<script src="grhAlmanac_config.js"></script>
<script src="grhAlmanac_supabase.js"></script>
<script>
document.getElementById("updatedOn").textContent = "Updated on " + new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
let item = null;
const contentEl = document.getElementById("content");

function renderNotFound() {
  contentEl.innerHTML = `
    <div class="not-found">
      <a class="full-record-btn" href="index.html">Page is Not Populated Yet – Return to Front Page <span class="arrow-right">→</span></a>
    </div>
  `;
}

/* Admin Mode -- HTML/interaction mockup only, matching grhAlmanac_index.html's
   Decision 10 pattern. Nothing here writes to Supabase yet: Save/Add Method
   update the in-memory `item` only and re-render, so the visual/interaction
   design was reviewed before real write-wiring, which is now built: Save
   and Add Method call the real adminUpdateStaticField / adminInsertAttribute
   / adminInsertValuation functions (from grhAlmanac_supabase.js) and refetch
   from Supabase afterward, same pattern as grhAlmanac_index.html. */
let adminMode = false;
let adminPassword = null;
let editingField = null;      // path string of the field currently being edited, or null
let addingMethodFor = null;   // family name whose "Add Method" form is open, or null
let saveError = null;         // { key, message } -- key matches editingField/attr/family identity

// Maps the JS-side path used in the UI to the actual SQL field name
// admin_update_static_field expects. Differentiation and Summary already
// had backend support before this pass; the other five were added to
// admin_update_static_field alongside this wiring.
const STATIC_FIELD_MAP = {
  "summary": "summary",
  "body.differentiation": "differentiation",
  "body.valueProposition": "value_proposition",
  "body.mvpDescription": "mvp_description",
  "body.productEnhancements": "product_enhancements",
  "body.marketingSummary": "marketing_summary",
  "body.competitiveLandscape": "competitive_landscape",
};


function enableAdminMode() {
  adminMode = true;
  document.body.classList.add("admin-mode");
  document.getElementById("adminToggleBtn").classList.add("on");
  document.getElementById("adminToggleBtn").textContent = "Admin Mode: On";
  document.getElementById("adminStatusLabel").style.display = "inline";
  render();
}
function disableAdminMode() {
  adminMode = false;
  adminPassword = null;
  editingField = null;
  addingMethodFor = null;
  updatingCompetitors = false;
  updatingBuildStatus = false;
  document.body.classList.remove("admin-mode");
  document.getElementById("adminToggleBtn").classList.remove("on");
  document.getElementById("adminToggleBtn").textContent = "Admin Mode: Off";
  document.getElementById("adminStatusLabel").style.display = "none";
  render();
}
function showPasswordModal() {
  document.getElementById("pwModalError").style.display = "none";
  document.getElementById("pwModalInput").value = "";
  document.getElementById("pwModalBackdrop").style.display = "flex";
  document.getElementById("pwModalInput").focus();
}
function hidePasswordModal() {
  document.getElementById("pwModalBackdrop").style.display = "none";
}
async function submitPasswordModal() {
  const input = document.getElementById("pwModalInput").value;
  const errEl = document.getElementById("pwModalError");
  const submitBtn = document.getElementById("pwModalSubmit");
  submitBtn.disabled = true;
  submitBtn.textContent = "Checking…";
  try {
    const ok = await checkAdminPassword(input);
    if (ok) {
      adminPassword = input;
      hidePasswordModal();
      enableAdminMode();
    } else {
      errEl.textContent = "Incorrect password.";
      errEl.style.display = "block";
      document.getElementById("pwModalInput").value = "";
      document.getElementById("pwModalInput").focus();
    }
  } catch (err) {
    errEl.textContent = "Couldn't reach the server to check the password.";
    errEl.style.display = "block";
    console.error(err);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Unlock";
  }
}
document.getElementById("adminToggleBtn").addEventListener("click", () => {
  if (adminMode) disableAdminMode(); else showPasswordModal();
});
document.getElementById("pwModalSubmit").addEventListener("click", submitPasswordModal);
document.getElementById("pwModalCancel").addEventListener("click", hidePasswordModal);
document.getElementById("pwModalInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") submitPasswordModal();
});

// Same edit-in-place pattern as index.html's renderEditableField, applied
// to the five detail-page-only fields. Save is a local mock -- it does not
// call adminUpdateStaticField, since that function doesn't know these
// fields yet.
function renderEditableField(path, label, currentValue) {
  const isEditing = editingField === path;
  const value = currentValue || "";
  if (isEditing) {
    const errHtml = (saveError && saveError.key === path)
      ? `<div class="pw-modal-error" style="display:block;">${saveError.message}</div>` : "";
    return `
      <div class="field-block">
        <div class="field-label">${label}</div>
        <textarea class="edit-textarea" id="editbox-${path}" rows="4">${value}</textarea>
        ${errHtml}
        <div class="edit-actions">
          <button class="edit-save-btn" data-save-field="${path}">Save</button>
          <button class="edit-cancel-btn" data-cancel-field="1">Cancel</button>
        </div>
      </div>
    `;
  }
  return `
    <div class="field-block">
      <div class="field-label">${label}</div>
      <div class="field-text editable-field" data-edit-field="${path}">${value || "Not yet assessed – no analysis has been logged for this initiative yet."}</div>
    </div>
  `;
}

// "Add Valuation Method" form, one per family -- calls the real
// adminInsertValuation function and refetches on success.
function renderAddMethodForm(familyName) {
  const isOpen = addingMethodFor === familyName;
  const safeFamily = familyName.replace(/[^a-zA-Z0-9]/g, "_");
  if (!isOpen) {
    return `<div class="add-method-trigger" data-open-add-method="${familyName}">+ Add Valuation Method</div>`;
  }
  const errHtml = (saveError && saveError.key === `family|${familyName}`)
    ? `<div class="pw-modal-error" style="display:block;">${saveError.message}</div>` : "";
  return `
    <div class="admin-update-form">
      <div class="field-label">Add Valuation Method – ${familyName}</div>
      <div class="admin-update-note">Appends a new method row to this family; existing rows are untouched.</div>
      <input class="edit-input wide" id="newMethodName-${safeFamily}" placeholder="Method name (e.g. Revenue Multiple Company Valuation)">
      <textarea class="edit-textarea" id="newMethodAssumptions-${safeFamily}" rows="2" placeholder="Assumptions"></textarea>
      <div class="val-form-row">
        <input class="edit-input" id="newMethodYear1-${safeFamily}" placeholder="Year 1">
        <input class="edit-input" id="newMethodYear3-${safeFamily}" placeholder="Year 3">
        <input class="edit-input" id="newMethodYear5-${safeFamily}" placeholder="Year 5">
      </div>
      ${errHtml}
      <div class="edit-actions">
        <button class="edit-save-btn" data-save-new-method="${familyName}">Save Method</button>
        <button class="edit-cancel-btn" data-cancel-new-method="1">Cancel</button>
      </div>
    </div>
  `;
}

function renderValuationTable(valuation) {
  if (!valuation || !valuation.families || valuation.families.length === 0) {
    return `<div class="empty-state">Not yet modeled – no valuation methods or assumptions have been logged for this initiative yet.</div>`;
  }
  // Converts a stored literal newline into a real line break -- used so a
  // Year cell holding more than one dollar figure can force each figure
  // onto its own line (Jamie's convention: a new revenue/cost number
  // always starts a fresh line) rather than running together in prose.
  const nl2br = (s) => (s ?? "–").replace(/\n/g, "<br>");
  return valuation.families.map(fam => {
    const rows = fam.methods.map(m => `
      <tr>
        <td>
          <div class="field-label">${m.name}</div>
          <div class="field-text val-note-text">${m.assumptions || "Assumptions not yet defined."}</div>
        </td>
        <td class="num">${nl2br(m.year1)}</td>
        <td class="num">${nl2br(m.year3)}</td>
        <td class="num">${nl2br(m.year5)}</td>
      </tr>
    `).join("");
    return `
      <div class="val-family-block">
        <div class="val-family-header">${fam.family}</div>
        <table class="val-table">
          <thead>
            <tr>
              <th>Method &amp; Assumptions</th>
              <th class="num">Year 1</th>
              <th class="num">Year 3</th>
              <th class="num">Year 5</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        ${adminMode ? renderAddMethodForm(fam.family) : ""}
      </div>
    `;
  }).join("");
}

// Attribute-tracked field, matching index.html's renderAttrField pattern
// (an "Update" trigger opening a small value+note form) rather than the
// simple edit-in-place pattern above -- Competitors is backed by the
// append-only `competitors` table, not a plain overwrite. Calls the real
// adminInsertAttribute function and refetches on success.
let updatingCompetitors = false;
let updatingBuildStatus = false;
// Attribute-tracked field, matching renderCompetitorsField's pattern below --
// Current Development Status is backed by the append-only `build_status`
// table (still named build_status on the wire/DB side; "Current Development
// Status" is the display label only). Calls the real adminInsertAttribute
// function and refetches on success.
function renderBuildStatusField(currentValue) {
  const value = currentValue || "";
  if (updatingBuildStatus) {
    const errHtml = (saveError && saveError.key === "buildStatus")
      ? `<div class="pw-modal-error" style="display:block;">${saveError.message}</div>` : "";
    return `
      <div class="field-block">
        <div class="field-label attr-field">Current Development Status
          <span class="attr-update-trigger" data-open-build-status="1">Update →</span>
        </div>
        <div class="field-text">${value}</div>
        <div class="admin-update-form">
          <div class="field-label">Admin Update – Current Development Status</div>
          <div class="admin-update-note">Appends a new entry; it never overwrites the value above.</div>
          <textarea class="edit-textarea" id="buildStatusNewValue" rows="2">${value}</textarea>
          <input class="edit-input" id="buildStatusNote" placeholder="Optional note">
          ${errHtml}
          <div class="edit-actions">
            <button class="edit-save-btn" data-save-build-status="1">Save Update</button>
            <button class="edit-cancel-btn" data-cancel-build-status="1">Cancel</button>
          </div>
        </div>
      </div>
    `;
  }
  return `
    <div class="field-block">
      <div class="field-label attr-field">Current Development Status
        <span class="attr-update-trigger" data-open-build-status="1">Update →</span>
      </div>
      <div class="field-text">${value}</div>
    </div>
  `;
}

function renderCompetitorsField(currentValue) {
  const value = currentValue || "";
  if (updatingCompetitors) {
    const errHtml = (saveError && saveError.key === "competitors")
      ? `<div class="pw-modal-error" style="display:block;">${saveError.message}</div>` : "";
    return `
      <div class="field-block">
        <div class="field-label attr-field">Strongest Direct Competitors
          <span class="attr-update-trigger" data-open-competitors="1">Update →</span>
        </div>
        <div class="field-text">${value}</div>
        <div class="admin-update-form">
          <div class="field-label">Admin Update – Competitors</div>
          <div class="admin-update-note">Appends a new entry; it never overwrites the value above.</div>
          <textarea class="edit-textarea" id="competitorsNewValue" rows="2">${value}</textarea>
          <input class="edit-input" id="competitorsNote" placeholder="Optional note">
          ${errHtml}
          <div class="edit-actions">
            <button class="edit-save-btn" data-save-competitors="1">Save Update</button>
            <button class="edit-cancel-btn" data-cancel-competitors="1">Cancel</button>
          </div>
        </div>
      </div>
    `;
  }
  return `
    <div class="field-block">
      <div class="field-label attr-field">Strongest Direct Competitors
        <span class="attr-update-trigger" data-open-competitors="1">Update →</span>
      </div>
      <div class="field-text">${value}</div>
    </div>
  `;
}

function render() {
  if (!item) {
    renderNotFound();
    return;
  }
  const ent = ENTITY_META[item.entity];
  const status = STATUS_META[item.opportunity];
  const na = "Not yet assessed – no analysis has been logged for this initiative yet.";
  const field = (val) => val || na;

  contentEl.innerHTML = `
    <h1>${item.name} – Grand River Hills Inc. Almanac</h1>
    <div class="badges">
      <span class="entity-badge ${ent.cls}" title="${ent.full}">${ent.label}</span>
      <span class="status-pill" style="background:${status.color}">${status.label}</span>
    </div>
    <p class="entity-source">${entitySourceLine(item)}</p>
    ${adminMode ? renderEditableField("summary", "Product/Service Description", item.summary)
                : `<p class="summary-text">${item.summary}</p>`}

    <div class="panel">
      <div class="panel-title">Current Development Status</div>
      <p class="panel-note">Where this initiative actually stands, build-wise -- what exists versus what's still concept or spec.</p>
      ${adminMode ? renderBuildStatusField(item.buildStatus)
                  : `<div class="field-block"><div class="field-label">Current Development Status</div><div class="field-text">${field(item.buildStatus)}</div></div>`}
    </div>

    <div class="panel">
      <div class="panel-title">Market Assessment</div>
      <p class="panel-note">Value proposition, product scope, and marketing positioning for this initiative.</p>
      ${adminMode ? renderEditableField("body.valueProposition", "Value Proposition", item.body.valueProposition)
                  : `<div class="field-block"><div class="field-label">Value Proposition</div><div class="field-text">${field(item.body.valueProposition)}</div></div>`}
      ${adminMode ? renderEditableField("body.mvpDescription", "Minimum Viable Product Description", item.body.mvpDescription)
                  : `<div class="field-block"><div class="field-label">Minimum Viable Product Description</div><div class="field-text">${field(item.body.mvpDescription)}</div></div>`}
      ${adminMode ? renderEditableField("body.productEnhancements", "Slated Product Line Enhancements", item.body.productEnhancements)
                  : `<div class="field-block"><div class="field-label">Slated Product Line Enhancements</div><div class="field-text">${field(item.body.productEnhancements)}</div></div>`}
      <div class="field-block">
        <div class="field-note">Touching on the 7 P's of Marketing – Product, Price, Place, Promotion, People, Process, Physical Evidence.</div>
        ${adminMode ? renderEditableField("body.marketingSummary", "Marketing Summary", item.body.marketingSummary)
                    : `<div class="field-label">Marketing Summary</div><div class="field-text">${field(item.body.marketingSummary)}</div>`}
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Competitor Positioning</div>
      <p class="panel-note">Landscape, strongest direct competitors, and differentiation for this initiative.</p>
      ${adminMode ? renderEditableField("body.competitiveLandscape", "Competitive Landscape", item.body.competitiveLandscape)
                  : `<div class="field-block"><div class="field-label">Competitive Landscape</div><div class="field-text">${field(item.body.competitiveLandscape)}</div></div>`}
      ${adminMode ? renderCompetitorsField(item.competitors)
                  : `<div class="field-block"><div class="field-label">Strongest Direct Competitors</div><div class="field-text">${field(item.competitors)}</div></div>`}
      ${adminMode ? renderEditableField("body.differentiation", "Differentiation", item.body.differentiation)
                  : `<div class="field-block"><div class="field-label">Differentiation</div><div class="field-text">${field(item.body.differentiation)}</div></div>`}
    </div>

    <div class="panel">
      <div class="panel-title">Valuations Forecasting</div>
      <p class="panel-note">Grouped by product line, with each valuation method's assumptions projected across Year 1, Year 3, and Year 5.</p>
      ${renderValuationTable(item.valuation)}
    </div>
  `;

  if (adminMode) bindAdminHandlers();
}

// Event delegation re-bound after every render(), same defensive pattern as
// index.html: re-checks adminMode at click time rather than trusting CSS
// alone to hide the affordance.
function bindAdminHandlers() {
  contentEl.querySelectorAll("[data-edit-field]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      editingField = el.dataset.editField;
      addingMethodFor = null;
      render();
    });
  });
  contentEl.querySelectorAll("[data-save-field]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      const path = el.dataset.saveField;
      const box = document.getElementById(`editbox-${path}`);
      const newValue = box.value;
      const sqlField = STATIC_FIELD_MAP[path];
      el.disabled = true;
      el.textContent = "Saving…";
      try {
        const ok = await adminUpdateStaticField(adminPassword, item.id, sqlField, newValue, item.version);
        if (ok) {
          await refetchItem();
          editingField = null;
          saveError = null;
        } else {
          saveError = { key: path, message: "This was edited elsewhere since you loaded the page. Reload to see the latest version before saving." };
        }
      } catch (err) {
        saveError = { key: path, message: err.message || "Save failed." };
      }
      render();
    });
  });
  contentEl.querySelectorAll("[data-cancel-field]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      editingField = null;
      saveError = null;
      render();
    });
  });

  contentEl.querySelectorAll("[data-open-add-method]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      addingMethodFor = el.dataset.openAddMethod;
      editingField = null;
      saveError = null;
      render();
    });
  });
  contentEl.querySelectorAll("[data-cancel-new-method]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      addingMethodFor = null;
      saveError = null;
      render();
    });
  });
  contentEl.querySelectorAll("[data-save-new-method]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      const familyName = el.dataset.saveNewMethod;
      const safeFamily = familyName.replace(/[^a-zA-Z0-9]/g, "_");
      const name = document.getElementById(`newMethodName-${safeFamily}`).value;
      const errKey = `family|${familyName}`;
      if (!name) {
        saveError = { key: errKey, message: "Method name is required." };
        render();
        return;
      }
      const assumptions = document.getElementById(`newMethodAssumptions-${safeFamily}`).value;
      const year1 = document.getElementById(`newMethodYear1-${safeFamily}`).value;
      const year3 = document.getElementById(`newMethodYear3-${safeFamily}`).value;
      const year5 = document.getElementById(`newMethodYear5-${safeFamily}`).value;
      el.disabled = true;
      el.textContent = "Saving…";
      try {
        await adminInsertValuation(adminPassword, item.id, familyName, name, assumptions, year1, year3, year5);
        await refetchItem();
        addingMethodFor = null;
        saveError = null;
      } catch (err) {
        saveError = { key: errKey, message: err.message || "Save failed." };
      }
      render();
    });
  });

  contentEl.querySelectorAll("[data-open-build-status]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      updatingBuildStatus = true;
      editingField = null;
      addingMethodFor = null;
      saveError = null;
      render();
    });
  });
  contentEl.querySelectorAll("[data-cancel-build-status]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      updatingBuildStatus = false;
      saveError = null;
      render();
    });
  });
  contentEl.querySelectorAll("[data-save-build-status]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      const newVal = document.getElementById("buildStatusNewValue").value;
      const note = document.getElementById("buildStatusNote").value;
      el.disabled = true;
      el.textContent = "Saving…";
      try {
        await adminInsertAttribute(adminPassword, item.id, "build_status", newVal, note || null);
        await refetchItem();
        updatingBuildStatus = false;
        saveError = null;
      } catch (err) {
        saveError = { key: "buildStatus", message: err.message || "Save failed." };
      }
      render();
    });
  });

  contentEl.querySelectorAll("[data-open-competitors]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      updatingCompetitors = true;
      editingField = null;
      addingMethodFor = null;
      saveError = null;
      render();
    });
  });
  contentEl.querySelectorAll("[data-cancel-competitors]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      updatingCompetitors = false;
      saveError = null;
      render();
    });
  });
  contentEl.querySelectorAll("[data-save-competitors]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!adminMode) return;
      const newVal = document.getElementById("competitorsNewValue").value;
      const note = document.getElementById("competitorsNote").value;
      el.disabled = true;
      el.textContent = "Saving…";
      try {
        await adminInsertAttribute(adminPassword, item.id, "competitors", newVal, note || null);
        await refetchItem();
        updatingCompetitors = false;
        saveError = null;
      } catch (err) {
        saveError = { key: "competitors", message: err.message || "Save failed." };
      }
      render();
    });
  });
}

async function refetchItem() {
  const DATA = await loadInitiatives();
  item = DATA.find(d => d.id === id);
  return item;
}

(async () => {
  try {
    await refetchItem();
    render();
  } catch (err) {
    contentEl.innerHTML = `
      <div class="not-found">
        <p style="color:#C97D60; font-size:14px;">Couldn't load initiative data from the database. ${err.message}</p>
      </div>
    `;
    console.error(err);
  }
})();
</script>
</body>
</html>
